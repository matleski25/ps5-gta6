name: Strona i licznik zbiórki

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"   # co godzinę
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pobierz stan zbiórki z buycoffee.to
        run: node scripts/update.mjs data.json
      - name: Przygotuj pliki strony
        run: mkdir _site && cp index.html data.json _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
